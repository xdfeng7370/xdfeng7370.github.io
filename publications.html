    function esc(s){
      return (s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function sortFn(a,b){
      if ((b.year||0) !== (a.year||0)) return (b.year||0) - (a.year||0);
      return (a.title||"").localeCompare(b.title||"");
    }

    function renderItem(p){
      const title = `<span class="pub-title">${esc(p.title)}</span>`;
      const authors = esc(p.authors);
      const venue = esc(p.venue);
      const year = p.year ? esc(String(p.year)) : "";
      let link = "";
      if (p.link){
        const txt = esc(p.linkText || p.link);
        link = ` <a class="pub-link" href="${esc(p.link)}" target="_blank" rel="noopener">${txt}</a>`;
      }
      // Authors, Title, venue, year. (matching screenshot sentence style)
      return `${authors}, ${title}, ${venue}${link}, ${year}.`;
    }

    const submitted = pubs.filter(p => p.status === "submitted").sort(sortFn);
    const published = pubs.filter(p => p.status === "published").sort(sortFn);

    const submittedStart = total;
    const publishedStart = total - submitted.length;

    const subOl = document.getElementById("submittedList");
    const pubOl = document.getElementById("publishedList");

    subOl.setAttribute("start", submittedStart);
    pubOl.setAttribute("start", publishedStart);

    subOl.innerHTML = submitted.map(p => `<li>${renderItem(p)}</li>`).join("");
    pubOl.innerHTML = published.map(p => `<li>${renderItem(p)}</li>`).join("");
