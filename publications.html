  // ========== Rendering helpers ==========
  const esc = s => (s||"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#39;");

  const sortFn = (a,b)=> ((b.year||0)-(a.year||0)) || (a.title||"").localeCompare(b.title||"");

  // ✅ 选择“作者链接”跳转到哪里：
  // "scholar" = Google Scholar 搜索该作者（推荐：每个作者都有独立链接）
  // "paper"   = 跳到该论文链接（所有作者链接相同，但也满足“都有链接”）
  const AUTHOR_LINK_MODE = "scholar";

  const scholarUrl = (name) =>
    `https://scholar.google.com/scholar?hl=en&q=${encodeURIComponent(name)}`;

  const authorHref = (name, paperUrl) =>
    (AUTHOR_LINK_MODE === "paper" ? paperUrl : scholarUrl(name));

  function renderAuthors(authorList, paperUrl){
    const a = (authorList || []).map(name =>
      `<a class="pub-author" href="${esc(authorHref(name, paperUrl))}" target="_blank" rel="noopener">${esc(name)}</a>`
    );
    if (a.length <= 1) return a[0] || "";
    if (a.length === 2) return `${a[0]} and ${a[1]}`;
    return `${a.slice(0, -1).join(", ")}, and ${a[a.length - 1]}`;
  }

  function renderItem(p){
    const paperUrl = (p.url || "").trim();
    const authorsHtml = renderAuthors(p.authors, paperUrl);

    const titleHtml = paperUrl
      ? `<a class="pub-title" href="${esc(paperUrl)}" target="_blank" rel="noopener">${esc(p.title)}</a>`
      : `<span class="pub-title">${esc(p.title)}</span>`;

    return `${authorsHtml}, ${titleHtml}, ${esc(p.venue)}, ${esc(String(p.year||""))}.`;
  }

  // ========== Build lists ==========
  const submitted = pubs.filter(p=>p.status==="submitted").sort(sortFn);
  const published = pubs.filter(p=>p.status==="published").sort(sortFn);

  const total = submitted.length + published.length;
  const subOl = document.getElementById("submittedList");
  const pubOl = document.getElementById("publishedList");

  subOl.setAttribute("start", total);
  pubOl.setAttribute("start", total - submitted.length);

  subOl.innerHTML = submitted.map(p=>`<li>${renderItem(p)}</li>`).join("");
  pubOl.innerHTML = published.map(p=>`<li>${renderItem(p)}</li>`).join("");

  // ✅ 给作者链接一点样式（不破坏你原来的整体风格）
  const style = document.createElement("style");
  style.textContent = `
    a.pub-author{ text-decoration: none; color: inherit; }
    a.pub-author:hover{ text-decoration: underline; opacity: .95; }
  `;
  document.head.appendChild(style);
</script>
