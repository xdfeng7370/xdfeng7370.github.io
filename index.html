<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About | Xiaodong Feng</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="avatar" src="assets/fengxiaodong.jpg" alt="avatar" />
        <span class="brand-name">Xiaodong Feng (冯晓东)</span>
      </div>

      <!-- 大屏导航 -->
      <nav class="nav" id="topNav">
        <a class="active" href="index.html">About</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="talks.html">Talks</a>
        <a href="assets/CV.pdf" target="_blank" rel="noopener">CV</a>
      </nav>

      <!-- 小屏 hamburger -->
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        &#9776;
      </button>

      <!-- 小屏下拉菜单 -->
      <div class="nav-menu" id="navMenu" aria-hidden="true">
        <a class="active" href="index.html">About</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="talks.html">Talks</a>
        <a href="assets/CV.pdf" target="_blank" rel="noopener">CV</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">About</h1>

    <div class="hero">
      <img class="hero-img" src="assets/fengxiaodong.jpg" alt="hero" />
    </div>

    <section class="section">
      <h2 class="name-title">Xiaodong Feng</h2>
      <p>
        Write your bio here. Keep it simple: affiliation, position, research interests, etc.
      </p>
      <p>
        You can add a Chinese paragraph here as well.
      </p>
      <p>
        Research interests: xxx, xxx, xxx.
      </p>
    </section>
  </main>

  <script>
    (function(){
      const btn = document.getElementById('navToggle');
      const menu = document.getElementById('navMenu');
      if(!btn || !menu) return;

      function closeMenu(){
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        menu.setAttribute('aria-hidden','true');
      }

      btn.addEventListener('click', () => {
        const isOpen = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(isOpen));
        menu.setAttribute('aria-hidden', String(!isOpen));
      });

      document.addEventListener('click', (e) => {
        if (!menu.classList.contains('open')) return;
        if (menu.contains(e.target) || btn.contains(e.target)) return;
        closeMenu();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });

      window.addEventListener('resize', () => {
        if (window.matchMedia('(min-width: 761px)').matches) closeMenu();
      });
    })();
  </script>
</body>
</html>
