<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Publications | Xiaodong Feng</title>
  <link rel="stylesheet" href="assets/style.css" />

  <style>
    .pub-section{
      color:#b91c1c;
      font-weight:800;
      margin: 18px 0 10px;
      font-family: var(--font-sans, inherit);
    }

    /* ✅ publications 列表字体/行距：与 index 的 section p 一致 */
    ol.pub-list{
      margin: 0;
      padding-left: 2.3em;
      list-style: decimal;

      font-size: 18px;
      line-height: 1.85;
    }
    ol.pub-list li{ margin: 10px 0; }
    ol.pub-list li::marker{
      content: counter(list-item) ", ";
      font-weight: 800;
      font-family: var(--font-sans, inherit);
    }

    a.pub-title{
      font-weight: 800;
      text-decoration: underline;
      color: inherit;
    }
    a.pub-title:hover{ opacity: .9; }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="avatar" src="assets/fengxiaodong.jpg" alt="avatar" />
        <span class="brand-name">Xiaodong Feng (冯晓东)</span>
      </div>

      <!-- ✅ 大屏导航（小屏会被 CSS 隐藏） -->
      <nav class="nav nav-desktop" id="topNav">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a class="active" href="publications.html">Publications</a>
        <a href="talks.html">Talks</a>
        <a href="assets/CV.pdf" target="_blank" rel="noopener">CV</a>
      </nav>

      <!-- ✅ 小屏 hamburger（大屏会被 CSS 隐藏） -->
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        &#9776;
      </button>

      <!-- ✅ 小屏下拉菜单（默认隐藏） -->
      <div class="nav-menu" id="navMenu" aria-hidden="true">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a class="active" href="publications.html">Publications</a>
        <a href="talks.html">Talks</a>
        <a href="assets/CV.pdf" target="_blank" rel="noopener">CV</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Publications</h1>

    <h2 class="pub-section">Submitted:</h2>
    <ol id="submittedList" class="pub-list" reversed></ol>

    <h2 class="pub-section" style="margin-top:22px;">Published:</h2>
    <ol id="publishedList" class="pub-list" reversed></ol>
  </main>

  <script>
    const pubs = [
      // Submitted
      { status:"submitted", year:2025,
        authors:"Xiaodong Feng, Tao Tang, Xiaoliang Wan, and Tao Zhou",
        title:"Overcoming Spectral Bias via Cross-Attention",
        venue:"arXiv preprint arXiv:2512.18586",
        url:"https://arxiv.org/abs/2512.18586" },

      { status:"submitted", year:2025,
        authors:"Xiaodong Feng, Ling Guo, Xiaoliang Wan, Hao Wu, Tao Zhou, and Wenwen Zhou",
        title:"LVM-GP: Uncertainty-Aware PDE Solver via coupling latent variable model and Gaussian process",
        venue:"arXiv preprint arXiv:2507.22493",
        url:"https://arxiv.org/abs/2507.22493" },

      { status:"submitted", year:2024,
        authors:"Xiaodong Feng, Haojiong Shangguan, Tao Tang, Xiaoliang Wan, and Tao Zhou",
        title:"A hybrid FEM-PINN method for time-dependent partial differential equations",
        venue:"arXiv preprint arXiv:2409.02810",
        url:"https://arxiv.org/abs/2409.02810" },

      // Published
      { status:"published", year:2026,
        authors:"Xiaodong Feng, Haojiong Shangguan, Tao Tang, and Xiaoliang Wan",
        title:"Integral Regularization PINNs for Evolution Equations",
        venue:"Communications in Computational Physics, 39(2):356–386, 2026",
        url:"https://global-sci.com/index.php/cicp/article/view/23347" },

      { status:"published", year:2023,
        authors:"Xiaodong Feng, Yue Qian, and Wanfang Shen",
        title:"MC-Nonlocal-PINNs: Handling Nonlocal Operators in PINNs via Monte Carlo Sampling",
        venue:"Numerical Mathematics: Theory, Methods and Applications, 16(3):769–791, 2023",
        url:"https://global-sci.com/index.php/nmtma/article/view/14453" },

      { status:"published", year:2022,
        authors:"Xiaodong Feng and Li Zeng",
        title:"Gradient-enhanced deep neural network approximations",
        venue:"Journal of Machine Learning for Modeling and Computing, 3(4), 2022",
        url:"https://www.dl.begellhouse.com/journals/558048804a15188a,22e553d25a1b5ff0,6658196f7b72ef2f.html" },

      { status:"published", year:2022,
        authors:"Xiaodong Feng, Li Zeng, and Tao Zhou",
        title:"Solving Time Dependent Fokker-Planck Equations via Temporal Normalizing Flow",
        venue:"Communications in Computational Physics, 32(2):401–423, 2022",
        url:"https://global-sci.com/cicp/article/view/7087" }
    ];

    const esc = s => (s||"")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");

    const sortFn = (a,b)=> ((b.year||0)-(a.year||0)) || (a.title||"").localeCompare(b.title||"");

    const renderItem = p => {
      const title = `<a class="pub-title" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`;
      return `${esc(p.authors)}, ${title}, ${esc(p.venue)}, ${esc(String(p.year))}.`;
    };

    const submitted = pubs.filter(p=>p.status==="submitted");
    const published = pubs.filter(p=>p.status==="published");

    const total = submitted.length + published.length;
    const subOl = document.getElementById("submittedList");
    const pubOl = document.getElementById("publishedList");
    subOl.setAttribute("start", total);
    pubOl.setAttribute("start", total - submitted.length);

    subOl.innerHTML = submitted.map(p=>`<li>${renderItem(p)}</li>`).join("");
    pubOl.innerHTML = published.map(p=>`<li>${renderItem(p)}</li>`).join("");
  </script>

  <script>
    (function(){
      const btn = document.getElementById('navToggle');
      const menu = document.getElementById('navMenu');
      if(!btn || !menu) return;

      function closeMenu(){
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        menu.setAttribute('aria-hidden','true');
      }

      btn.addEventListener('click', () => {
        const isOpen = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(isOpen));
        menu.setAttribute('aria-hidden', String(!isOpen));
      });

      document.addEventListener('click', (e) => {
        if (!menu.classList.contains('open')) return;
        if (menu.contains(e.target) || btn.contains(e.target)) return;
        closeMenu();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });

      window.addEventListener('resize', () => {
        if (window.matchMedia('(min-width: 981px)').matches) closeMenu();
      });
    })();
  </script>
</body>
</html>
